# Presidente Vargas 3D — Nginx ANTES de existir certificado (sem domínio ou antes do certbot).
# Só :80: responde o desafio ACME (certbot --webroot) e a página de manutenção (503). O jogo NUNCA é servido em
# HTTP puro (cookies Secure + produção). O provision-vps.sh troca por tretario.conf quando o certificado existe.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 503;
    }
    error_page 503 /__maintenance.html;
    location = /__maintenance.html {
        internal;
        root /var/www/tretario-maintenance;
        try_files /index.html =503;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
