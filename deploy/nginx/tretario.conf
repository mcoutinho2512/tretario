# Presidente Vargas 3D — Nginx de produção (deploy/CONTRACT.md). MODELO: o provision-vps.sh troca __DOMAIN__ e
# instala em /etc/nginx/sites-available/tretario.conf (+ snippets/tretario-*.conf). Testar: `sudo nginx -t`.
# Nginx do Ubuntu 24.04 = 1.24 (por isso `listen ... ssl http2` em vez de `http2 on`).

# ---- contexto http (este arquivo é incluído dentro de http {} por sites-enabled) ----
limit_req_zone $binary_remote_addr zone=tretario_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=tretario_ticket:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=tretario_api:10m rate=30r/s;
# matchmaking do Colyseus: cada POST reserva um lugar por ~15 s e o app não limita
limit_req_zone $binary_remote_addr zone=tretario_matchmake:10m rate=30r/m;

# WebSocket: Upgrade → "upgrade"; requisição comum → "" (mantém o keepalive com o upstream)
map $http_upgrade $tretario_connection {
    default upgrade;
    ''      '';
}

# rotas que continuam respondendo com a manutenção ligada
# volatile: reavaliado após o redirecionamento interno do error_page (senão o valor de "/" fica em cache e a página
# de manutenção cai no 503 padrão do Nginx)
map $uri $tretario_maint_exempt {
    volatile;
    default               0;
    /health/live          1;
    /__maintenance.html   1;
}

upstream tretario_game {
    server 127.0.0.1:2567;
    keepalive 16;
}

upstream tretario_api {
    server 127.0.0.1:2568;
    keepalive 16;
}

# ---- :80 → só ACME (certbot --webroot) e redirecionamento para HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- :443 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tretario_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/tretario/current/dist;
    index index.html;
    charset utf-8;

    client_max_body_size 256k;
    client_body_timeout 15s;
    limit_req_status 429;

    include /etc/nginx/snippets/tretario-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/wasm image/svg+xml model/gltf+json;

    # ---- manutenção: existe o arquivo-flag → 503 com a página estática (exceto /health/live) ----
    set $tretario_maint 0;
    if (-f /opt/tretario/shared/maintenance.on) {
        set $tretario_maint 1;
    }
    if ($tretario_maint_exempt) {
        set $tretario_maint 0;
    }
    if ($tretario_maint) {
        return 503;
    }
    error_page 503 /__maintenance.html;
    location = /__maintenance.html {
        internal;
        root /var/www/tretario-maintenance;
        try_files /index.html =503;
        include /etc/nginx/snippets/tretario-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
    }

    # ---- nunca públicos: /internal/* e /metrics (só do próprio servidor) ----
    location ^~ /internal/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include /etc/nginx/snippets/tretario-proxy.conf;
        proxy_pass http://tretario_api;
    }
    location ^~ /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include /etc/nginx/snippets/tretario-proxy.conf;
        proxy_pass http://tretario_api;
    }

    # ---- jogo: /game/ → 127.0.0.1:2567/ (prefixo removido), WebSocket ----
    location = /game {
        return 301 /game/;
    }
    # matchmaking HTTP (POST /game/matchmake/joinOrCreate/...) → /matchmake/... no Colyseus, com limite por IP
    location ^~ /game/matchmake/ {
        limit_req zone=tretario_matchmake burst=10 nodelay;
        include /etc/nginx/snippets/tretario-proxy.conf;
        proxy_pass http://tretario_game/matchmake/;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/tretario-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /game/ {
        include /etc/nginx/snippets/tretario-proxy.conf;
        proxy_pass http://tretario_game/;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_request_buffering off;
        include /etc/nginx/snippets/tretario-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ---- API e health → 127.0.0.1:2568 (sem remover prefixo), sem cache ----
    location ^~ /api/ {
        limit_req zone=tretario_api burst=60 nodelay;
        include /etc/nginx/snippets/tretario-proxy.conf;
        proxy_pass http://tretario_api;
        proxy_read_timeout 30s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        include /etc/nginx/snippets/tretario-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /api/auth/ {
        limit_req zone=tretario_auth burst=10 nodelay;
        limit_req zone=tretario_api burst=60 nodelay;
        include /etc/nginx/snippets/tretario-proxy.conf;
        proxy_pass http://tretario_api;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/tretario-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /api/session/ticket {
        limit_req zone=tretario_ticket burst=10 nodelay;
        include /etc/nginx/snippets/tretario-proxy.conf;
        proxy_pass http://tretario_api;
        proxy_read_timeout 15s;
        include /etc/nginx/snippets/tretario-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /health/ {
        include /etc/nginx/snippets/tretario-proxy.conf;
        proxy_pass http://tretario_api;
        proxy_read_timeout 10s;
        include /etc/nginx/snippets/tretario-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ---- estáticos (current/dist) ----
    # nomes com hash de conteúdo → 1 ano, imutável
    location ^~ /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/tretario-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ ^/world/(chunk_|collision\.) {
        try_files $uri =404;
        include /etc/nginx/snippets/tretario-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    # index, manifestos e dados JSON sem hash → sempre revalidar (ETag/Last-Modified dão 304)
    location = / {
        try_files /index.html =404;
        include /etc/nginx/snippets/tretario-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        include /etc/nginx/snippets/tretario-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.(json|webmanifest)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/tretario-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    # arquivos que existem no dist mas não são do site
    location = /_headers {
        return 404;
    }
    location ~ /\. {
        return 404;
    }
    # modelos/texturas sem hash (personagens, veículos, vegetação, landmarks, ui): 1 dia + revalidação
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/tretario-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }
}

# ---- https://www.__DOMAIN__ → https://__DOMAIN__ (origem única: PV_PUBLIC_ORIGIN e CSP wss://__DOMAIN__) ----
# o certificado precisa cobrir o www (provision-vps.sh --with-www); sem isso o www dá erro de certificado
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://__DOMAIN__$request_uri;
}
