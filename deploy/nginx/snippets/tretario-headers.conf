# Cabeçalhos de segurança do Presidente Vargas 3D (incluído no server E em toda location que tenha add_header:
# no Nginx um add_header dentro da location descarta os herdados). __DOMAIN__ trocado pelo provision-vps.sh.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Frame-Options "DENY" always;
# BETA: fora dos buscadores (o index.html também pode trazer <meta name="robots">)
add_header X-Robots-Tag "noindex, nofollow" always;
# CSP conferida contra o `vite build`: index.html sem script inline (um <script type=module src> + CSS);
# 'wasm-unsafe-eval' = WebAssembly do Rapier; worker-src blob: = workers do HumanCharacter; style-src
# 'unsafe-inline' = atributos style="" gerados via innerHTML (HUD/editor); img data: = favicon/texturas.
# Google Analytics 4 (src/analytics/ga.ts, só depois do consentimento): gtag.js de www.googletagmanager.com;
# coleta em *.google-analytics.com / *.analytics.google.com (connect e img).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' wss://__DOMAIN__ data: blob: https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
