# Proxy para o Node (127.0.0.1). X-Forwarded-For é SOBRESCRITO com o IP real da conexão (nunca anexa o que o
# cliente mandou); o app só confia nele vindo de 127.0.0.1 (PV_TRUST_PROXY=loopback).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection $tretario_connection;
proxy_set_header Upgrade $http_upgrade;
proxy_connect_timeout 5s;
