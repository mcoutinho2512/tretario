# PostgreSQL 16 — Presidente Vargas 3D, VPS de 8 GB (instalado em /etc/postgresql/16/main/conf.d/).
# Conservador: o processo Node (até 3 GB, MemoryMax) e o cache do SO dividem a máquina com o banco.
listen_addresses = 'localhost'          # NUNCA público (ufw também não abre 5432)
port = 5432
max_connections = 50                    # Prisma: pool pequeno por processo + CLI/backup
password_encryption = scram-sha-256

shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 8MB
maintenance_work_mem = 256MB
wal_buffers = 16MB
random_page_cost = 1.1                  # SSD/NVMe
effective_io_concurrency = 100
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB

idle_in_transaction_session_timeout = 60s
statement_timeout = 0                   # o app define os seus; migrations podem demorar
log_min_duration_statement = 500ms      # consultas lentas no log
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
log_temp_files = 10MB
